name: Test setup-gitea-action

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Existing Juju model available on the runner."
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      # This workflow assumes the runner has already been provisioned with
      # Kubernetes and Juju, for example by the repository's existing
      # Concierge-based setup. The action itself intentionally does not
      # provision either environment.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Gitea and git-integrator
        uses: ./
        with:
          model: ${{ inputs.model }}

      - name: Verify git-integrator
        shell: bash
        run: |
          set -euo pipefail
          juju status --model "${{ inputs.model }}" git-integrator
          kubectl get pods -n gitea

      - name: Clean up
        if: always()
        shell: bash
        env:
          JUJU_MODEL: ${{ inputs.model }}
          GITEA_NAMESPACE: gitea
        run: bash "${{ github.action_path }}/scripts/cleanup.sh"
